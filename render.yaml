# Render Blueprint — deploys the API (free web service) + dashboard (free static site).
# Render dashboard → New → Blueprint → pick this repo. Then set GROQ_API_KEY.
services:
  - type: web
    name: demand-iq-api
    runtime: python
    plan: free
    rootDir: backend
    # Runtime-only deps (~180MB installed). Training deps are in requirements-train.txt
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false          # prompted on first deploy — never commit the key
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CHAT_RATE_LIMIT
        value: "10"
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: demand-iq-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: demand-iq-api
          property: host     # e.g. demand-iq-api.onrender.com — client.js adds https://
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
